name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is Python 3.10 (see pyproject.toml): 3.9 is end-of-life, and the pinned
        # pytest 9 requires 3.10. Each entry is a minor version, never an exact patch,
        # because `actions/setup-python` has no hosted build for 3.9 on ubuntu-latest
        # (Ubuntu 26.04) and only the newest few patches for the older minors. An exact
        # patch pin fails at setup on a runner image that has no build for it.
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: ruff check .

    - name: Check format with ruff
      run: ruff format --check .

    - name: Run tests
      run: pytest

  terraform-gate:
    # Runs the whole test set with the terraform binary present, so the pins that read the provider schema through
    # `tests/conftest.py` run here, and with the tflint binary present, so the pins that run the rule set run here.
    # The matrix job runs the same set on runners with no binary, where those pins skip for the missing binary.
    # The job runs `pytest` with no module list, because a list can drift: a module that starts reading the schema
    # would not be in CI.
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Terraform
      # The CI Terraform version, stated once here. It is the line Epic 12 decision 1 takes, and the gate answers
      # recorded in the documents name the version they were measured on, not this one.
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.16.7'

    - name: Set up tflint
      # The version is pinned, because the severities and the exit codes the pins hold were measured on it, and the
      # committed answer was measured on it. The bundled Terraform Language ruleset needs no `--init` and no plugin
      # install, so the rule set needs no network at test time.
      run: |
        curl -sL https://github.com/terraform-linters/tflint/releases/download/v0.66.0/tflint_linux_amd64.zip -o tflint.zip
        unzip tflint.zip
        ./tflint --version
        echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

    - name: Run the whole test set with the provider schema and the rule set
      run: pytest
