name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is Python 3.10 (see pyproject.toml): 3.9 is end-of-life, and the pinned
        # pytest 9 requires 3.10. Each entry is a minor version, never an exact patch,
        # because `actions/setup-python` has no hosted build for 3.9 on ubuntu-latest
        # (Ubuntu 26.04) and only the newest few patches for the older minors. An exact
        # patch pin fails at setup on a runner image that has no build for it.
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: ruff check .

    - name: Run tests
      run: pytest

  terraform-gate:
    # Validates generated output against the real provider with
    # terraform init + terraform validate. The test skips when the
    # terraform binary is absent, so this job is the one that runs it.
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.16.1'

    - name: Terraform init and validate gate
      run: pytest tests/test_terraform_validate.py
