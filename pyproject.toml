# Project tool configuration.
# Python >= 3.10: Python 3.9 is end-of-life, and the pinned pytest 9 requires 3.10.
# `target-version` states the syntax level the lint gate enforces, not the floor. It stays
# py39 because the codebase still writes pre-3.10 typing (`Optional[X]`, `typing.List`) and
# `zip` without `strict`; the one-time pass that moves it to py310 is in `backlog.md`.

[tool.ruff]
line-length = 120
target-version = "py39"
# Where ruff looks for first-party modules, so the import order stays the same after the layout move:
# the tool's modules in `src/`, and the test harness in `tests/`.
src = ["src", "tests"]

[tool.ruff.lint]
# Baseline rule set for the lint gate.
# E, W: pycodestyle. F: pyflakes. I: import order. UP: modern syntax.
# B: bugbear. SIM: simplify. C4: comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
# The layout rule (`docs/ARCHITECTURE.md` §1.1): `tests/` holds every test, so the root holds none and
# `testpaths` keeps discovery at the repository root. `pythonpath` is the one place the test path is
# stated: every tool module is imported by plain name from the `src/` namespace.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
